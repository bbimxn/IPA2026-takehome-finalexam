- name: Apply desired Loopback interface state
  hosts: routers
  gather_facts: false

  vars:
    ansible_host: "{{ router }}"
    ansible_user: "{{ lookup('env', 'ROUTER_USER') }}"
    ansible_password: "{{ lookup('env', 'ROUTER_PASS') }}"

  tasks:
    - name: Validate Loopback interface name
      ansible.builtin.assert:
        that:
          - interface_name is string
          - interface_name is match('^Loopback[0-9]+$')
        fail_msg: "Invalid Loopback interface name"

    - name: Apply interface configuration
      cisco.ios.ios_config:
        defaults: true
        parents:
          - "interface {{ interface_name }}"
        lines:
          - "description {{ description }}"
          - "ip address {{ ipv4_address }} {{ netmask }}"
          - "{{ 'shutdown' if (shutdown | bool) else 'no shutdown' }}"
